# Simplified open-field coordination configuration.
# Use with open_field.world to evaluate swarm coordination without internal obstacles.

/**:
  ros__parameters:
    num_robots: 6

    # Reynolds weights (coordination-focused)
    w_separation: 1.1
    w_alignment: 1.1
    w_cohesion: 1.4
    w_obstacle: 0.0
    w_migration: 1.0

    # Disable obstacle term for open-field baseline.
    enable_obstacle_avoidance: false

    # Local interaction radii
    neighbor_radius: 3.0
    separation_radius: 0.7
    obstacle_threshold: 0.6

    # Motion limits
    max_linear_vel: 0.20
    max_angular_vel: 1.4

    # Odom frame handling
    odom_pose_frame_mode: auto

    # Keep all robots on a shared path so they converge together.
    waypoint_lane_spread: 0.0

    # Goal marker in open_field.world is at (17.0, 10.0)
    waypoints:
      - 8.0
      - 7.5
      - 12.5
      - 8.8
      - 17.0
      - 10.0
