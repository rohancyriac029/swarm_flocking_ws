# config/flocking_params.yaml
# Tunable parameters for the swarm flocking simulation.
# All BoidNode and FlockMonitorNode instances load this file.
#
# Tuning guide:
#   w_separation: Raise if robots collide. Typical range: 1.0 – 3.0
#   w_alignment:  Raise for tighter heading synchronization. Range: 0.5 – 2.0
#   w_cohesion:   Raise to keep flock more compact. Range: 0.5 – 2.0
#   w_obstacle:   Critical for safe navigation. Keep > separation. Range: 2.0 – 5.0
#   w_migration:  Global pull toward path waypoints. Range: 0.6 – 1.5
#   neighbor_radius: Larger = more cooperative but more CPU. Range: 2.0 – 4.0
#   separation_radius: Should be > robot_diameter (0.178m for TurtleBot3 Burger)

/**:
  ros__parameters:
    # Total robots in the swarm (override per-node via launch)
    num_robots: 6

    # ─── Reynolds Force Weights ───────────────────────────────────────────────
    w_separation: 1.2     # Avoid robot-robot crowding without over-repulsion
    w_alignment:  0.8     # Smooth heading convergence
    w_cohesion:   0.9     # Keep the flock connected
    w_obstacle:   1.8     # Reactive obstacle avoidance (LaserScan-based)
    w_migration:  1.1     # Stronger global pull toward current waypoint

    # ─── Sensing Ranges (meters) ──────────────────────────────────────────────
    neighbor_radius:    2.5   # Max range to consider another robot a neighbor
    separation_radius:  0.6   # Below this, separation force activates
    obstacle_threshold: 0.55  # Laser reading below this triggers avoidance

    # ─── Motion Limits ────────────────────────────────────────────────────────
    max_linear_vel:  0.22     # m/s (TurtleBot3 Burger hardware limit)
    max_angular_vel: 1.8      # rad/s

    # ─── Adaptive Weight Scaling ──────────────────────────────────────────────
    k_sep: 0.4
    min_sep_w: 0.8
    max_sep_w: 2.4
    alpha_coh: 0.15
    min_coh_w: 0.6
    max_coh_w: 1.8
    ideal_separation: 0.8
    threshold_spread: 1.2
    min_obs_w: 0.5
    max_obs_w: 3.0
    laser_epsilon: 0.03

    # Odom frame handling: auto, local, world
    # auto picks local/world from the first odom sample.
    odom_pose_frame_mode: auto

    # Per-lane Y offset for intermediate waypoints to reduce bottleneck jams.
    waypoint_lane_spread: 0.18

    # ─── Waypoints (flat list: x0, y0, x1, y1, ...) ──────────────────────────
    # Matches obstacle_course.world corridors:
    #   approach bottleneck gap -> cross open field -> go above center maze wall -> descend to goal
    waypoints:
      - 8.6    # WP0 x — center of bottleneck crossing
      - 7.5    # WP0 y
      - 15.5   # WP1 x — cross open field
      - 7.5    # WP1 y
      - 23.0   # WP2 x — rise above central vertical maze wall
      - 9.8    # WP2 y
      - 27.8   # WP3 x — pass above right-side maze block
      - 9.8    # WP3 y
      - 28.0   # WP4 x — descend into goal zone
      - 7.5    # WP4 y
